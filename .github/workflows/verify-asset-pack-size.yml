name: Verify Asset Pack reduces size

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'feature/asset-pack-support'

jobs:
  verify-size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'feature/asset-pack-support' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build sample-delivery AAB
        run: ./gradlew :sample-delivery:bundleRelease --no-daemon

      - name: Analyze sizes (base / feature / asset pack)
        run: |
          set -e
          AAB=$(find sample-delivery/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "AAB: $AAB"
          mkdir -p /tmp/aab
          unzip -q "$AAB" -d /tmp/aab

          echo "=== Top-level modules ==="
          du -sh /tmp/aab/* || true

          BASE_MB=$(du -sm /tmp/aab/base 2>/dev/null | cut -f1 || echo 0)
          echo "Base (MB): $BASE_MB"

          FEATURE_MB=0
          if [ -d /tmp/aab/mushaf_feature ]; then
            FEATURE_MB=$(du -sm /tmp/aab/mushaf_feature | cut -f1)
            echo "mushaf_feature (MB): $FEATURE_MB"
          else
            echo "mushaf_feature not present"
          fi

          # Look for asset pack
          PACK_DIR=$(find /tmp/aab -maxdepth 2 -type d -name "*mushaf*" -o -name "asset-pack*" | grep -v base | grep -v mushaf_feature | head -1 || true)
          if [ -n "$PACK_DIR" ]; then
            PACK_MB=$(du -sm "$PACK_DIR" | cut -f1)
            echo "Asset pack dir: $PACK_DIR ($PACK_MB MB)"
          else
            echo "No asset pack directory found in AAB"
          fi

          # Base should be reasonable (Realm + code). Images should be in the pack.
          if [ "$BASE_MB" -gt 120 ]; then
            echo "ERROR: Base is ${BASE_MB}MB — images may still be bundled"
            exit 1
          fi

          echo "OK: Base=${BASE_MB}MB, Feature=${FEATURE_MB}MB"
