name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0)'
        required: true
        default: '0.2.0'
      branch:
        description: 'Branch to publish from'
        required: false
        default: 'feature/asset-pack-support'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'feature/asset-pack-support' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update version
        run: |
          sed -i "s/VERSION_NAME=.*/VERSION_NAME=${{ github.event.inputs.version }}/" gradle.properties

      - name: Publish to GitHub Packages
        run: ./gradlew :mushaf-core:publish :mushaf-ui:publish --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
