name: Build and release 0.4.1

# One-shot helper: gates the release/0.4.1 branch, tags 0.4.1 and asks JitPack to build it.
on:
  push:
    branches: [release/0.4.1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-0.4.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Gates - API, unit tests, publish, AAR contents, minified app
        run: |
          set -euxo pipefail
          grep -E '^(GROUP|VERSION_NAME)=' gradle.properties
          ./gradlew apiCheck testDebugUnitTest :app:testSourceDebugUnitTest
          ./gradlew :mushaf-core:publishToMavenLocal :mushaf-ui:publishToMavenLocal :mushaf-images:publishToMavenLocal -x lint
          bash scripts/verify-aar.sh
          ./gradlew :app:assembleSourceRelease -x lint
      - name: Tag 0.4.1
        run: |
          set -euxo pipefail
          git config user.name "Mahmoud Mabrok Fouad"
          git config user.email "mahmoudmabrok3579@gmail.com"
          git tag -a 0.4.1 -m "0.4.1: hiding the player stops playback; loadChapter honours autoPlay=false"
          git push origin refs/tags/0.4.1
      - name: Ask JitPack to build 0.4.1 and wait
        run: |
          set -uo pipefail
          BASE="https://jitpack.io/com/github/MahmoudMabrok/mushaf-imad-android"
          for i in $(seq 1 40); do
            ok=1
            for m in mushaf-ui mushaf-core mushaf-images; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -m 300 "$BASE/$m/0.4.1/$m-0.4.1.pom")
              echo "try $i $m pom -> $code"
              [ "$code" = "200" ] || ok=0
            done
            [ $ok = 1 ] && break
            sleep 30
          done
          curl -s -m 120 "$BASE/0.4.1/build.log" | tail -30
          [ $ok = 1 ] || { echo "::error::JitPack did not publish 0.4.1"; exit 1; }
